spring:
  application:
    name: paper-explainer-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/paper_explainer
    username: paper_admin
    password: paper_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

logging:
  file:
    name: logs/app.log

app:
  storage:
    upload-dir: storage/papers

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  chat-model: ${OLLAMA_CHAT_MODEL:qwen2.5:3b}